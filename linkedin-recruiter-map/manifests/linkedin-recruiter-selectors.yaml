# ---------------------------------------------------------------------------
# E. SAVE FLOW (Pass 3 CORRECTION: stage-aware, not project-picker-aware)
# ---------------------------------------------------------------------------
# Pass 3 finding: the primary Save button saves to the CURRENT URL's project
# at that project's DEFAULT STAGE. There is no project-picker dialog on the
# primary path. The Save-stage chooser is a secondary dropdown for stage
# selection.
#
# IMPLICATION: project safety is enforced by URL, not by a dialog gate.
# Cloris MUST verify URL.projectId == envelope.targetProjectId BEFORE click.
save_flow:
  default_stage_extraction:
    source: save_to_pipeline_button.name
    pattern: "^Save to '(?P<defaultStage>[^']+)'$"
    classification: stable_now
    verified: true
    notes: 'Pass 3: read the default stage from the button name before saving.'
  stage_picker_dropdown:
    trigger: save_stage_chooser
    classification: unknown   # contents not captured in Pass 3
    verified: false
    notes: 'Pass 4 candidate: opening dropdown to read stage names is potentially non-mutating; selecting a stage IS mutating.'
  save_toast:
    role: status
    name_pattern: 'saved to'
    classification: unknown
    verified: false
    notes: not observable without performing a save; Pass 5 (mutation worker validation) territory
  post_save_verification:
    primary:    in_projects_section now lists targetProjectName
    secondary:  save_to_pipeline button name changes
    tertiary:   left-nav pipeline count increments by 1
    notes: 'Pass 3 recommended algorithm in docs/pass-3-live-observations.md §I.1'

