#   options: getByRole('listbox') > getByRole('option')
#   chips:   active_filter_chips with text starting with filter label

# ---------------------------------------------------------------------------
# FILTER PILL MECHANICS (Pass 2 correction)
# ---------------------------------------------------------------------------
# Each filter is a TWO-STEP control, not a direct input:
#   step 1: button name='Add {label}' (role=button)  -> click to reveal editor
#   step 2: editor is one of: combobox+listbox, multi-select list, range, toggle, free-text
# Chips render INSIDE the filter group as inline items prefixed with '+':
#   e.g. '+Amazon', '+Full-Stack Development (8.9M+)', '+San Francisco Bay Area'
# The numeric suffix '(N.NM+)' is LinkedIn's candidate-pool estimate for that chip.
#
# Section anchoring on Advanced surface:
#   getByRole('heading', { name: /^Candidate details$/i }).locator('..')
# Section names (Advanced):
#   - Candidate details
#   - Education & experience
#   - Company
#   - Recruiting & candidate activity
filter_pill_pattern:
  open:    "button[role='button'][name='Add {label}']"
  editor:  "depends on filter type (combobox / listbox / range / switch / textbox)"
  chip:    "text node prefixed with '+' inside the filter group; may include trailing '(NUM+)' pool-size"
  remove:  "click the chip OR open editor and uncheck (prefer chip click)"
  verify:  "new chip appears within ~2s of suggestion click; URL gains searchContextId/searchHistoryId"
  failure: "silent no-op: typed + clicked suggestion, no chip within 2s → reopen and reclick (per LinkedIn skill)"

