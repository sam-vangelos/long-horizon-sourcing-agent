    label: 'Search by job title, ideal candidate, keyword, or boolean'
    placeholder: 'Type anything here'
    role: combobox
    name_pattern: 'job title.*ideal candidate.*keyword.*boolean'
    selector: 'role=combobox[name=/job title.*ideal candidate.*keyword.*boolean/i]'
    classification: stable_now
    verified: true
    mutation: type
    verification: suggestion dropdown appears; URL gains/changes searchContextId
    semantics: boolean_plus_natural_language
    boolean_ops: [AND, OR, NOT, '""', '()']
    natural_language: true
    char_limit: 2000
    failure_modes:
      - silent truncation past char_limit
      - autocomplete intercepts Enter
      - did-you-mean replaces literal query
      - 'Enter inside PER-FILTER inputs dismisses dropdown without applying — only the top-bar combobox uses Enter productively'
    notes: 'Pass 2: AI-assisted intent is INLINED into this combobox (accessible name includes ideal candidate). There is no separate AI-Assisted panel on this seat.'

  submit_button:
    label: Search
    role: button
    name_pattern: '^search$'
    classification: unknown
    verified: false
    mutation: click
    notes: 'Pass 2: not observed on the empty search surface. Filters apply incrementally; there may be no separate Search button on this seat. Treat top-bar Enter or suggestion-click as the submit path.'

  clear_button:
    label: Clear
    role: button
    name_pattern: '^clear$'
    classification: unknown
    verified: false
    mutation: click

