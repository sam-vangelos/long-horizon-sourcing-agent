# ---------------------------------------------------------------------------
# RECOVERY SIGNALS
# ---------------------------------------------------------------------------
recovery_signals:
  logged_out:
    detect: 'url matches /login or /checkpoint/ OR title contains "Sign in"'
    action: halt_emit_reauth
  blocked:
    detect: '/checkpoint/challenge/ OR captcha iframe OR "Unusual activity" banner'
    action: backoff_24h
  wrong_surface:
    detect: 'url does not match expected route family for step'
    action: halt_step_replan
  wrong_seat:
    detect: 'Advanced search button absent OR filter count ~20'
    action: halt_refuse_mutations
  no_project_context:
    detect: 'url lacks /hire/<projectId>/ AND envelope expected project'
    action: halt_refuse_mutations
  lost_project_context:
    detect: 'url.projectId != envelope.targetProjectId'
    action: halt_mutating_step
  stale_search:
    detect: 'result_count_text unchanged within 5s after apply OR chip delta wrong'
    action: re_apply_once
  browser_crash:
    detect: 'document.body.children.length < 2 OR no [role="main"] for >10s'
    action: restart_session
  profile_unavailable:
    detect: 'text matches /no longer available|cannot find/i'
    action: skip_candidate
  member_id_unavailable:
    detect: 'name == "LinkedIn Member" AND no /talent/profile/ link'
    action: skip_redacted
  save_unverified:
    detect: 'no Saved badge AND no pipeline count delta within 5s of save'
    action: halt_no_retry
    notes: NEVER retry save — risk of double-save

# ---------------------------------------------------------------------------
# WORKER POLICY
# ---------------------------------------------------------------------------
worker_policy:
  default_mode: read_only
  mutating_intents_require:
    - explicit_intent_in_envelope: true
    - target_project_id_match: true
    - idempotency_token: true
    - human_confirmation: configurable
  forbidden_in_default_mode:
    - save_to_project
    - remove_from_project
    - move_pipeline_stage
    - add_note
    - edit_note
    - add_tag
    - reject
    - hide
    - block
    - report
    - endorse
    - connect
    - follow
    - inmail
    - message
    - share
    - export
    - bulk_action_any
    - project_switcher
