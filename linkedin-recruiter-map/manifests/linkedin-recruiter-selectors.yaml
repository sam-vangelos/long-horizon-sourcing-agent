# ---------------------------------------------------------------------------
# A. ROUTES & PAGE STATE
# ---------------------------------------------------------------------------
routes:
  recruiter_home:
    pattern: ^https://www\.linkedin\.com/talent/?$
    classification: stable_now
    verified: false
  project_home:
    pattern: ^https://www\.linkedin\.com/talent/hire/(?P<projectId>\d+)(/|$)
    classification: stable_now
    verified: false
  project_search:
    pattern: ^https://www\.linkedin\.com/talent/hire/(?P<projectId>\d+)/discover/recruiterSearch(?:$|\?)
    classification: stable_now
    verified: true
    notes: confirmed live 2026-05-19
    query_params:
      searchContextId:  { semantics: opaque, source: server }
      searchHistoryId:  { semantics: opaque, source: server }
      searchRequestId:  { semantics: opaque, source: server }
      start:            { semantics: integer_offset, source: client }
      uiOrigin:         { semantics: enum, source: client, examples: [FACET_SEARCH] }
    worker_policy: round-trip opaque params unchanged; never invent values
  project_search_advanced:
    pattern: ^https://www\.linkedin\.com/talent/hire/(?P<projectId>\d+)/discover/recruiterSearch/advanced
    classification: stable_now
    verified: true
    notes: Advanced search is a sibling route, not a modal. URL alone verifies open state.
  pipeline:
    pattern: ^https://www\.linkedin\.com/talent/hire/(?P<projectId>\d+)/manage/pipeline
    classification: unknown
    verified: false
    notes: save-aware surface; treat as mutation-sensitive. Subpath inferred from left-nav 'Pipeline' item observed in Pass 2; not navigated.
  profile_full:
    pattern: ^https://www\.linkedin\.com/talent/profile/(?P<recruiterMemberId>[A-Za-z0-9_-]+)\?project=(?P<projectId>\d+)
    classification: stable_now
    verified: false
  profile_drawer_route:
    pattern: ^https://www\.linkedin\.com/talent/hire/(?P<projectId>\d+)/discover/recruiterSearch/profile/(?P<candidateId>[A-Za-z0-9_-]+)
    classification: stable_now
    verified: true
    query_params:
      searchContextId:  { semantics: opaque, source: server }
      searchHistoryId:  { semantics: opaque, source: server, notes: 'attribution back to source search' }
      searchRequestId:  { semantics: opaque, source: server }
      trk:              { semantics: enum, source: client, examples: [SEARCH_CONTEXTUAL] }
    notes: |
      Pass 3: profile drawer pushes URL AND mounts a role=dialog simultaneously.
      Either signal verifies open state. Prefer dialog presence (browser back can be flaky).
      trk=SEARCH_CONTEXTUAL is the entry-vector marker from search results.
  recommended_matches:
    pattern: ^https://www\.linkedin\.com/talent/hire/(?P<projectId>\d+)/discover/automatedSourcing/review
    classification: defer
    verified: true
    notes: Out of scope for search worker; routes here from "View all N recommended matches" link.
  saved_searches:
    pattern: ^https://www\.linkedin\.com/talent/search-history
    classification: defer
    verified: false
    notes: LinkedIn buried this entry point in 2024; URL still works
  login_wall:
    pattern: ^https://www\.linkedin\.com/(login|checkpoint/)
    classification: stable_now
    verified: false
    notes: emits recovery.logged_out
  checkpoint_challenge:
    pattern: ^https://www\.linkedin\.com/checkpoint/challenge/
    classification: stable_now
    verified: false
    notes: emits recovery.blocked

page_state:
  candidate_id_from_url:
    extractor: javascript
    code: |
      const m = window.location.pathname.match(/\/profile\/([A-Za-z0-9_-]+)/);
      return m ? m[1] : null;
    classification: stable_now
    verified: true
  search_history_id_from_url:
    extractor: javascript
    code: |
      return new URL(location.href).searchParams.get('searchHistoryId');
    classification: stable_now
    verified: true
    notes: 'Pass 3: present on every profile URL opened from search results; carries attribution back to the source search.'
  project_id_from_url:
    extractor: javascript
    code: |
      const m = window.location.pathname.match(/\/talent\/hire\/(\d+)\//);
      return m ? m[1] : null;
    classification: stable_now
    verified: true
  project_breadcrumb:
    selector: 'header, [role="navigation"][aria-label*="breadcrumb" i]'
    text_pattern: '{projectName} . Talent pool . Search'
    classification: stable_now
    verified: true
    notes: observed exact breadcrumb 'Technical Program Manager - May 2026 › Talent pool › Search'
  project_privacy_badge:
    selector: 'header :has-text(/Private . \\d+ member/i)'
    classification: stable_now
    verified: true
    notes: 'observed: Private . 1 member'. Use as project-context loaded ping.
  empty_search_probe:
    selector: 'main :has-text(/Start a search/i)'
    text: "Start a search — You haven't started a search yet. Use the search filters to start finding candidates."
    classification: stable_now
    verified: true
    notes: canonical 'search not yet run' precondition probe
  result_count_text:
    selector: 'form :text-matches("^[\\d.]+[KM]?\\+?\\s+results?$", "i")'
    classification: stable_now
    verified: true
    notes: 'Pass 3: observed format is e.g. "17M+ results". Supports K+/M+ suffixes for approximate large pools.'
    parse: |
      // returns { total, approximate, unit }
      // examples: "17M+ results", "650K+ results", "4,231 results", "45 results"
      const t = el.innerText.trim();
      const m = t.match(/^([\d.,]+)([KM])?(\+)?\s+results?$/i);
      if (!m) return null;
      const num = parseFloat(m[1].replace(/,/g, ''));
      const mult = m[2] === 'M' ? 1e6 : m[2] === 'K' ? 1e3 : 1;
      return {
        total: Math.round(num * mult),
        approximate: !!m[3],
        unit: m[2] || null,
      };
  active_filter_chips:
    role: button
    name_pattern: 'remove .* filter'
    selector: '[data-test-active-filter] button, [aria-label$="filter"]'
    classification: stable_now
    verified: false
  filter_complementary_pane:
    role: complementary
    name: 'Search filters and AI chat'
    selector: 'role=complementary[name="Search filters and AI chat"]'
    classification: stable_now
    verified: true
    notes: 'Pass 3: most stable anchor for the entire filter panel.'

