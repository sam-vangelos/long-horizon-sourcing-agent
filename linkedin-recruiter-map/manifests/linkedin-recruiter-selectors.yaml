# Cloris — LinkedIn Recruiter selector manifest
# Pass 1: scaffolded. `verified: false` rows MUST be confirmed against DOM dumps
# from capture-snippets/ before the worker treats them as stable_now.
#
# Schema:
#   <id>:
#     label:            exact visible label (UI source of truth)
#     section:          grouping/section in UI
#     classification:   stable_now | mock_only | defer | unknown
#     verified:         bool — has a human/script confirmed this against live DOM?
#     role:             ARIA role (preferred selector strategy)
#     name_pattern:     regex for accessible name (case-insensitive)
#     selector:         Playwright selector expression (fallback if role+name unavailable)
#     attribute_hints:  durable attrs to scope/verify on
#     mutation:         open|type|click|select|toggle|drag|range|read_only
#     verification:     post-action signal proving success
#     semantics:        OR|AND|exclude|current|past|both|range|single|multi
#     failure_modes:    [string]
#     mutating:         bool — if true, requires explicit intent envelope

version: 3
generated: 2026-05-19
