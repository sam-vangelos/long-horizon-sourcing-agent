# ---------------------------------------------------------------------------
# F.43 SPOTLIGHTS (Pass 3 fully mapped)
# ---------------------------------------------------------------------------
# Structure: region[name="Spotlights"] containing Previous/Next carousel buttons
# and a list of spotlight buttons. Each spotlight button's accessible name
# embeds the live count, e.g. "3.2M+ are Open to work".
spotlights_region:
  role: region
  name: 'Spotlights'
  classification: stable_now
  verified: true
  carousel:
    prev: { role: button, name: 'Previous', classification: stable_now, verified: true }
    next: { role: button, name: 'Next',     classification: stable_now, verified: true }
  button_name_parse: '^(?P<count>\S+)\s+are\s+(?P<label>.+)$'
  sub_panel_pattern:
    notes: |
      Some spotlights expose an in-card checkbox sub-panel when clicked
      (e.g. Internal candidates, Interested in your company). The sub-panel
      has Cancel and "Show results" buttons. Show results is MUTATING (alters
      the search). Cancel is safe.
    cancel: { role: button, name: 'Cancel', classification: stable_now, verified: true }
    show_results: { role: button, name: 'Show results', classification: defer, mutating: true, verified: true }

