name: Langfuse Eval

on:
  pull_request:
  schedule:
    - cron: "0 14 * * 1"
  workflow_dispatch:
    inputs:
      real_run:
        description: "Run the secret-backed sync + regression path"
        required: false
        default: false
        type: boolean

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio

      - name: Run Langfuse unit tests
        run: |
          python -m pytest tests/test_langfuse_observability.py tests/test_langfuse_dataset_export.py tests/test_prompt_regression_runner.py tests/test_langfuse_eval_loop.py -q

      - name: Validate manifest and eval-loop wiring
        run: |
          python -m tools.run_langfuse_eval_loop --manifest config/langfuse/eval_targets.json --reports-root output/langfuse --dry-run

  scheduled_eval:
    if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.real_run == true)
    runs-on: ubuntu-latest
    needs: validate
    env:
      LANGFUSE_PUBLIC_KEY: ${{ secrets.LANGFUSE_PUBLIC_KEY }}
      LANGFUSE_SECRET_KEY: ${{ secrets.LANGFUSE_SECRET_KEY }}
      LANGFUSE_HOST: ${{ secrets.LANGFUSE_HOST }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Langfuse eval loop
        run: |
          python -m tools.run_langfuse_eval_loop --manifest config/langfuse/eval_targets.json --reports-root output/langfuse

      - name: Upload Langfuse reports
        uses: actions/upload-artifact@v4
        with:
          name: langfuse-eval-reports
          path: output/langfuse/
          if-no-files-found: error
