name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # The browser-driven tests launch Chromium through rebrowser-playwright,
      # which ships the driver but not the browser build it pins.
      - name: Install Chromium for rebrowser-playwright
        run: python -m rebrowser_playwright install --with-deps chromium

      - name: Run credential-free validation suite
        run: make validate PYTHON=python
        env:
          CLORIS_SKIP_STARTUP_VALIDATION: "1"
