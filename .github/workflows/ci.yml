name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          # Match the production venv (Python 3.12.13) — P3, remediation spec.
          python-version: "3.12"

      - name: Install zsh
        run: |
          sudo apt-get update
          sudo apt-get install --yes zsh

      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-asyncio

      - name: Check repo hygiene
        run: make hygiene PYTHON=python

      - name: Run default Python suite
        run: make test-default PYTHON=python
        env:
          CLORIS_SKIP_STARTUP_VALIDATION: "1"
