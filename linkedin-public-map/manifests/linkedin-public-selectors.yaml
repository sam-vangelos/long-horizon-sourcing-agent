# Cloris — Public LinkedIn (linkedin.com) selector manifest
# Pass 1 scaffold + Pass 2a unauthenticated verification.
# `verified: false` rows MUST be confirmed against DOM dumps from
# capture-snippets/ (Pass 2b, authenticated) before the worker treats them as stable_now.
#
# Schema:
#   <id>:
#     label:            exact visible label (UI source of truth)
#     section:          grouping in UI
#     classification:   stable_now | mock_only | defer | unknown
#     verified:         bool — has Pass 2a/2b or a DevTools script confirmed this against live DOM?
#     role:             ARIA role (preferred selector strategy)
#     name_pattern:     regex for accessible name (case-insensitive)
#     href_pattern:     regex for href trk= substring (preferred over class on public LI)
#     selector:         Playwright selector expression (fallback)
#     attribute_hints:  durable attrs to scope/verify on
#     mutation:         open|type|click|select|toggle|read_only
#     verification:     post-action signal proving success
#     semantics:        single|multi|OR|AND|exclude
#     failure_modes:    [string]
#     mutating:         bool — if true, requires explicit intent envelope and is in worker_policy.forbidden_in_default_mode

