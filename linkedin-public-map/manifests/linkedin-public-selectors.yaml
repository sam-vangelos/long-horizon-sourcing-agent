# ---------------------------------------------------------------------------
# G. WORKER POLICY
# ---------------------------------------------------------------------------
worker_policy:
  forbidden_in_default_mode:
    - signin_modal_email_click
    - signin_modal_join_click
    - header_signin_click
    - header_join_click
    - topcard_join_click
    - bottom_cta_banner_click
    - see_all_activities_click
    - similar_profile_connect_click
    - post_react
    - post_comment
    - post_share
    - post_repost
    - post_save
    - article_react
    - article_comment
    - article_share
    - connect
    - follow
    - message
    - send_inmail
    - endorse
    - recommend
    - report
    - block
    - subscribe_newsletter
    - subscribe_hashtag
    - apply_to_job
    - im_interested_on_job
    - any_input_on_authwall
    - any_input_on_uas_login
    - any_button_on_authwall_join
    - any_button_on_authwall_signin
    - signin_with_apple
    - signin_with_google
    - signin_with_acme-software
    - open_the_app_deeplink
    - cold_join_form_submit
    - public_profile_join_form_submit

  read_only_always_allowed:
    - read_public_profile_dom
    - read_public_profile_jsonld
    - read_meta_tags
    - read_canonical_url
    - dismiss_signin_modal
    - dismiss_app_toast
    - navigate_to_public_profile
    - navigate_to_company_landing
    - read_url_state

  per_session_budgets:
    unauthenticated_profile_views:
      max: 3
      window_seconds: 1800
      escalation_signal: recovery.guest_view_limit
      notes: Hard cap is 3-5 per LinkedIn. Cloris budget set conservatively to 3.
    page_loads_per_minute:
      max: 20
      window_seconds: 60
      escalation_signal: recovery.rate_limit_self
      notes: Self-imposed; LinkedIn's actual threshold is undocumented.
    search_queries_per_hour:
      max: 50
      window_seconds: 3600
      escalation_signal: recovery.rate_limit_self
      notes: Conservative; raise only after Pass 2b validates.

  cookies_must_persist:
    - li_at
    - JSESSIONID
    - lidc
    - bcookie
    - bscookie
    - li_g_view

  recovery_signals:
    recovery.authwall_join:
      trigger: 'pathname == /authwall'
      action: halt_emit_reauth
    recovery.authwall_signin:
      trigger: 'pathname == /uas/login OR pathname startsWith /checkpoint/'
      action: halt_emit_reauth
    recovery.guest_view_limit:
      trigger: 'modal not dismissible OR profile content missing after Escape'
      action: halt_cooldown_30min
    recovery.surface_unavailable_authwall:
      trigger: 'attempted /company/.../people/ or /pub/dir/, got /authwall'
      action: drop_input_pivot
    recovery.surface_unavailable_login:
      trigger: 'attempted /search/results/people/, got /uas/login'
      action: drop_input_pivot
    recovery.profile_404:
      trigger: 'h1 matches "This page doesn''t exist" OR HTTP 404'
      action: drop_input
    recovery.blocked:
      trigger: 'pathname startsWith /checkpoint/challenge/ OR captcha iframe present'
      action: halt_cooldown_24h
    recovery.logged_out:
      trigger: 'had session, URL changed to /uas/login'
      action: emit_reauth_task
    recovery.browser_crash:
      trigger: 'document.body.children.length < 2 OR <main> missing'
      action: restart_worker
    recovery.unknown_surface:
      trigger: 'pathname matches no known route AND not an auth surface'
      action: halt_human_review
