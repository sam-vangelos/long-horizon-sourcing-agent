# ---------------------------------------------------------------------------
# A.2 PAGE STATE EXTRACTORS
# ---------------------------------------------------------------------------
page_state:
  surface_from_pathname:
    extractor: javascript
    code: |
      const p = window.location.pathname;
      if (p.startsWith('/in/')) return 'public_profile';
      if (p === '/authwall') return 'authwall_join';
      if (p === '/uas/login' || p.startsWith('/checkpoint/')) return 'authwall_signin';
      if (/^\/company\/[^/]+\/people\/?$/.test(p)) return 'company_people';
      if (p.startsWith('/pub/dir/')) return 'pub_dir_legacy';
      if (p.startsWith('/search/results/people')) return 'search_results_people';
      if (p.startsWith('/signup/')) return 'signup_forbidden';
      return 'unknown_surface';
    classification: stable_now
    verified: true
  vanity_from_url:
    extractor: javascript
    code: |
      const m = window.location.pathname.match(/^\/in\/([A-Za-z0-9_%.\-]+)/);
      return m ? decodeURIComponent(m[1]) : null;
    classification: stable_now
    verified: true
  company_slug_from_url:
    extractor: javascript
    code: |
      const m = window.location.pathname.match(/^\/company\/([A-Za-z0-9\-_]+)/);
      return m ? m[1] : null;
    classification: stable_now
    verified: false
  authwall_trk_from_url:
    extractor: javascript
    code: |
      if (window.location.pathname !== '/authwall') return null;
      return new URL(window.location.href).searchParams.get('trk');
    classification: stable_now
    verified: true
    notes: returns 'bf' (company origin) or 'gf' (guest flow origin)
  session_redirect_from_url:
    extractor: javascript
    code: |
      const sp = new URL(window.location.href).searchParams;
      return sp.get('sessionRedirect') || sp.get('session_redirect') || null;
    classification: stable_now
    verified: true
  guest_view_cookie:
    extractor: javascript
    code: |
      const m = document.cookie.match(/(?:^|;\s*)li_g_view=([^;]+)/);
      return m ? decodeURIComponent(m[1]) : null;
    classification: stable_now
    verified: false
    notes: Worker should read on every guest profile load and emit recovery.guest_view_limit at <budget> threshold.
  canonical_url:
    extractor: javascript
    code: |
      const l = document.querySelector('link[rel="canonical"]');
      return l ? l.href : null;
    classification: stable_now
    verified: false
    notes: Useful to confirm the actual /in/{vanity} when URL was redirected from /pub/dir/ etc.
  og_type:
    extractor: javascript
    code: |
      const m = document.querySelector('meta[property="og:type"]');
      return m ? m.getAttribute('content') : null;
    classification: stable_now
    verified: true
    notes: 'profile' on public profile pages, absent/website on authwall.
  jsonld_person:
    extractor: javascript
    code: |
      const scripts = document.querySelectorAll('script[type="application/ld+json"]');
      for (const s of scripts) {
        try {
          const data = JSON.parse(s.textContent);
          const arr = Array.isArray(data) ? data : (data['@graph'] || [data]);
          for (const node of arr) {
            if (node['@type'] === 'Person' || node['@type'] === 'ProfilePage') {
              return node;
            }
            if (node.mainEntityOfPage?.['@type'] === 'ProfilePage') return node;
          }
        } catch {}
      }
      return null;
    classification: stable_now
    verified: false
    notes: Pass 2b should confirm exact shape and key set on a public profile page.

