<!DOCTYPE html>
<html lang="en">
  <head><meta charset="utf-8" /><title>LinkedIn Login, Sign in | LinkedIn</title></head>
  <body>
    <header><a href="https://www.linkedin.com/">LinkedIn</a></header>

    <h1>Sign in</h1>

    <iframe title="Sign in with Google Button" src="https://accounts.google.com/gsi/button?client_id=990339570472-k6nqn1tpmitg8pui82bfaun3jrpmiuhs.apps.googleusercontent.com"></iframe>
    <iframe title="Sign in with Microsoft button" src="https://edge-auth.acme-software.com/v0.5/signinbutton?client_id=3fa91358-6f74-4525-b5df-da149652be36"></iframe>
    <button>Sign in with Apple</button>

    <form>
      <label>Email or phone <input type="email" required /></label>
      <label>Password <input type="password" required /></label>
      <button>Show</button>
      <a href="https://www.linkedin.com/checkpoint/rp/request-password-reset?session_redirect=%2Fsearch%2Fresults%2Fpeople%2F%3Fkeywords%3Dsoftware%2520engineer">Forgot password?</a>
      <label><input type="checkbox" checked /> Keep me logged in</label>
      <button>Sign in</button>
    </form>

    <p>New to LinkedIn? <a href="https://www.linkedin.com/signup/cold-join?session_redirect=%2Fsearch%2Fresults%2Fpeople%2F%3Fkeywords%3Dsoftware%2520engineer">Join now</a></p>
  </body>
</html>
