[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
# "not network" keeps the opt-in real-API smoke (test_integration_network_smoke)
# out of default runs: shared.config auto-loads .env, so on the operator
# machine the tests' env-key skip gates would otherwise pass and hit real APIs.
addopts = '-q -m "not network"'
markers = [
    "live_integration: opt-in tests that hit the real Perplexity API (require PERPLEXITY_API_KEY + PERPLEXITY_LIVE_INTEGRATION=1)",
    "network: opt-in tests that hit cheap real APIs (OpenAlex / GitHub / Google CSE) on a smoke fixture; skip when the relevant env keys are unset",
    "structural: asserts on declared shape or text (a constant, a default, a schema, an import boundary, source or script text, a tracked data file) and runs no behavior; it cannot fail when a function body is emptied, by design",
]
